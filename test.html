
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار Landmarksi</title>
</head>
<body style="font-family:Arial;text-align:center;padding:30px">

<h2>اختبار قاعدة بيانات Landmarksi</h2>
<p id="result">جارٍ الفحص...</p>

<script src="./config.js"></script>

<script>
(async function () {
  const result = document.getElementById("result");

  if (!window.SUPABASE_CONFIG) {
    result.textContent =
      "المشكلة: لم يتم تحميل config.js أو لم يتم التعرف على إعداداته.";
    return;
  }

  const { url, key } = window.SUPABASE_CONFIG;

  if (!url || !key) {
    result.textContent = "المشكلة: رابط المشروع أو المفتاح فارغ.";
    return;
  }

  try {
    const response = await fetch(
      url + "/rest/v1/articles?select=id,title&limit=5",
      {
        headers: {
          apikey: key,
          Authorization: "Bearer " + key
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || data.hint || response.status);
    }

    result.textContent =
      "نجح الاتصال! عدد المقالات: " + data.length;

  } catch (error) {
    result.textContent = "خطأ في الاتصال: " + error.message;
  }
})();
</script>

</body>
</html>
